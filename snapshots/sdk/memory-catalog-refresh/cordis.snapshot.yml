# Keyless replay counterpart of memory-catalog-refresh.cordis.yml: the scripted
# model turns come from replay.override.json and the store is the committed
# workspace `.dsh` home.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: memory
  name: '@deepseek-ai/dsh-memory'
  config:
    maxRecords: 200
    maxRecordBytes: 4096
    projectRootMarkers:
      - .dsh-project

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
    - id: memory-catalog-compaction
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/memory-catalog-compaction.ts'
