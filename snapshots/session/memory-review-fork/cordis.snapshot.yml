# Keyless replay counterpart of memory-review-fork.cordis.yml: apply the
# scenario values and model swap to the headless profile, and register the
# keyless replay adapter alongside the same test-only fixtures.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: memory-review
  name: '@deepseek-ai/dsh-memory-review'
  disabled: false
  config:
    reviewEveryUserTurns: 1
    maxReviewSteps: 8

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
    - id: quiesce-plugin-started-child
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/quiesce-plugin-started-child.ts'
