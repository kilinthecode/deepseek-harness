# Proactive compaction where a mounted pruner's preview alone does not clear
# the pressure headroom: compaction condenses the oldest balanced span on the
# original unpruned surface first, and the pruner trims the surviving tail
# afterward.

- id: llm-deepseek
  config:
    thinking: disabled
    models:
      - id: deepseek-v4-flash
        contextWindow: 9700
        maxTokens: 1000

- id: compaction-basic
  config:
    thresholdRatio: 0.8
    headroomTokens: 1800
    retainTokens: 20
    compactionRetries: 0

- id: tool-result-pruner
  config:
    thresholdChars: 200
    headChars: 80
    tailChars: 40
