- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                inputModalities: [text]

- id: tool-image-generation
  disabled: false

- id: image-generation-http
  name: '@deepseek-ai/dsh-image-generation-http'
  config:
    providers:
      fixture:
        api: openai-images
        baseURL: https://images.snapshot.test/v1
        apiKeyEnv: DSH_IMAGE_SNAPSHOT_KEY
        models:
          - id: draw
            name: Drawing

- insert:
    - id: image-generation-fixture
      name: './fixture.mjs'
