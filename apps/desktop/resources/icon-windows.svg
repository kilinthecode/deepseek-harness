<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="lift" cx="0.5" cy="0.47" r="0.62">
      <stop offset="0" stop-color="#262a34"/>
      <stop offset="1" stop-color="#191c23"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="44" fill="url(#lift)"/>

  <!-- tesseract, top-corner isometric projection. The tray renderer scales tray-glyph around (552, 544);
       the outer translate pair keeps that point on the tile center (512, 512). -->
  <g transform="translate(-40 -32)"><g id="tray-glyph"><g transform="translate(40 32)" stroke="#e9ebf1" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 4D edges: outer cell to inner cell -->
    <g stroke-width="12" opacity="0.68">
      <line x1="512" y1="172" x2="512" y2="369.2"/>
      <line x1="806.4" y1="342" x2="635.6" y2="440.6"/>
      <line x1="806.4" y1="682" x2="635.6" y2="583.4"/>
      <line x1="512" y1="852" x2="512" y2="654.8"/>
      <line x1="217.6" y1="682" x2="388.4" y2="583.4"/>
      <line x1="217.6" y1="342" x2="388.4" y2="440.6"/>
    </g>
    <!-- inner cell -->
    <g stroke-width="15" opacity="0.92">
      <polygon points="512,369.2 635.6,440.6 635.6,583.4 512,654.8 388.4,583.4 388.4,440.6"/>
      <line x1="512" y1="512" x2="512" y2="369.2"/>
      <line x1="512" y1="512" x2="635.6" y2="440.6"/>
      <line x1="512" y1="512" x2="635.6" y2="583.4"/>
      <line x1="512" y1="512" x2="512" y2="654.8"/>
      <line x1="512" y1="512" x2="388.4" y2="583.4"/>
      <line x1="512" y1="512" x2="388.4" y2="440.6"/>
    </g>
    <!-- outer cell -->
    <g stroke-width="18">
      <polygon points="512,172 806.4,342 806.4,682 512,852 217.6,682 217.6,342"/>
      <line x1="512" y1="512" x2="806.4" y2="342"/>
      <line x1="512" y1="512" x2="217.6" y2="342"/>
      <line x1="512" y1="512" x2="512" y2="852"/>
      <line x1="512" y1="512" x2="512" y2="172"/>
      <line x1="512" y1="512" x2="806.4" y2="682"/>
      <line x1="512" y1="512" x2="217.6" y2="682"/>
    </g>
  </g></g></g>
</svg>
