# Equivalent to the room profile layer over the scaffold's stable base and Web bundles.
- insert:
    - id: agent-team
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        maxMembers: 8
        maxTasks: 256
        maxPendingMessagesPerMember: 64
        maxMessageBytes: 65536
        disposalTimeoutMs: 5000
        roomEnabled: true
        roomTranscriptWindow: 20
        roomApprovalRatio: 0.5
        roomMaxProposalRevisions: 4
        roomReviewGraceMs: 120000
        roomReviewReminders: 1

    - id: tool-agent-team
      name: '@deepseek-ai/dsh-experimental-tool-agent-team'
      config:
        freshProvider: spawn
        forkProvider: fork

    - id: tool-agent-room
      name: '@deepseek-ai/dsh-experimental-tool-agent-room'
      config:
        maxTranscriptEntries: 20

    - id: ui-agent-team
      name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'
