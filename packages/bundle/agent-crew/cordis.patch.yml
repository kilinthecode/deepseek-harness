# Optional agent-crew bundle: adds the tools and skill that land, discard, and
# list worktree-isolated children. The tool-subagent-worktree row registers the
# isolation offer on the shared subagent-worktree service for as long as it is
# mounted, and every delegation tool whose provider has the cwd capability
# offers isolation while an offer is live. The bundle patches no service or
# tool-subagent row: agent presets mount their own tool-subagent rows, which an
# id-targeted patch cannot reach, and a later patch that replaces the
# subagent-worktree row's config, such as one pinning a reviewer route, cannot
# switch the offer off.

- insert:
    - id: tool-subagent-worktree
      name: '@deepseek-ai/dsh-tool-subagent-worktree'

    - id: skill-agent-crew
      name: '@deepseek-ai/dsh-skill-agent-crew'
