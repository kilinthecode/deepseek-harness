# Optional agent-crew bundle: switches the subagent tool to worktree
# isolation and adds the tools and skill that land, discard, and list those
# worktrees. An id-targeted patch replaces the whole config, so the
# tool-subagent row restates its dsh-base fields alongside the new
# worktreeIsolation switch. It does not add modelSelectionSettings: a row
# outside an agent preset rejects that flag at load, so worker route
# selection stays with the preset rows that set it.

- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    worktreeIsolation: true

- insert:
    - id: tool-subagent-worktree
      name: '@deepseek-ai/dsh-tool-subagent-worktree'

    - id: skill-agent-crew
      name: '@deepseek-ai/dsh-skill-agent-crew'
