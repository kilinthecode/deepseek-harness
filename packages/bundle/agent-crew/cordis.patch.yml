# Optional agent-crew bundle: offers worktree isolation on every subagent
# delegation tool and adds the tools and skill that land, discard, and list
# those worktrees. The switch is the shared subagent-worktree row's
# offerIsolation setting, not a tool-subagent row's worktreeIsolation: agent
# presets mount their own tool-subagent rows, which an id-targeted patch cannot
# reach, while every tool reads this service when it mounts. The base row
# carries no config, so this patch replaces nothing. A later patch on the row
# replaces this whole config and must restate offerIsolation.

- id: subagent-worktree
  config:
    offerIsolation: true

- insert:
    - id: tool-subagent-worktree
      name: '@deepseek-ai/dsh-tool-subagent-worktree'

    - id: skill-agent-crew
      name: '@deepseek-ai/dsh-skill-agent-crew'
